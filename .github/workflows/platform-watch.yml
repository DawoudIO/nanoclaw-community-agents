name: platform-watch
# Weekly check for upstream NanoClaw platform updates: the sbx VM image tag,
# the latest NanoClaw release, and the sbx kit spec. Opens an issue when any
# of them move, so a sandbox refresh can be planned. Zero agents involved.
# Order matters: the ISSUE is created before the baseline commit — if issue
# creation fails, the change stays undetected-state and re-fires next week
# instead of being recorded and never announced.
on:
  schedule:
    - cron: "0 14 * * 1"
  workflow_dispatch: {}
permissions:
  contents: write
  issues: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compare upstream versions to baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Tag digest: prefer the top-level digest; else the sorted-first
          # per-arch digest (stable across response ordering). sbx/nanoclaw-kit
          # is the prebuilt image this repo actually pulls (see docs/INSTALL.md §1) -
          # not nanoco/nanoclaw directly.
          DIGEST=$(curl -s "https://hub.docker.com/v2/repositories/sbx/nanoclaw-kit/tags/latest" \
            | jq -r '.digest // ((.images // []) | map(.digest) | sort | .[0]) // "unknown"')
          RELEASE=$(curl -s "https://api.github.com/repos/nanocoai/nanoclaw/releases/latest" | jq -r '.tag_name // "unknown"')
          KIT=$(curl -s "https://api.github.com/repos/docker/sbx-kits-contrib/commits?path=nanoclaw&per_page=1" | jq -r '.[0].sha // "unknown"')
          jq -n --arg d "$DIGEST" --arg r "$RELEASE" --arg k "$KIT" \
            '{image_digest: $d, release: $r, kit_commit: $k}' > current.json
          if [ -f platform-baseline.json ] && diff -q platform-baseline.json current.json >/dev/null 2>&1; then
            echo "No upstream change."; exit 0
          fi
          OLD=$(cat platform-baseline.json 2>/dev/null || echo '{}')
          # Dedupe: if a previous run already filed an update issue that's
          # still open (e.g. the baseline push below failed on a protected
          # branch), don't file another one every week forever.
          EXISTING=$(gh issue list --state open --search "Upstream update detected in:title" --json number --jq 'length')
          if [ "${EXISTING:-0}" -gt 0 ]; then
            echo "An upstream-update issue is already open; not filing a duplicate."; exit 0
          fi
          gh issue create \
            --title "Upstream update detected: plan a sandbox refresh ($(date -u +%F))" \
            --body "$(printf 'platform-watch found upstream changes.\n\n**Previous:**\n```json\n%s\n```\n**Current:**\n```json\n%s\n```\n\nChecklist (see docs/OPERATIONS.md → Staying up to date):\n- [ ] Read the NanoClaw release notes: https://github.com/nanocoai/nanoclaw/releases\n- [ ] Confirm last workspace-backup ran (follower series + project-config safe)\n- [ ] Refresh: set platform-baseline.json to the verified digest, then `sbx rm` → `docker pull docker.io/sbx/nanoclaw-kit@sha256:<that digest>` → `sbx run` against the same digest → restamp. NEVER pull the bare :latest tag for the upgrade itself — it can move between your decision and your pull\n- [ ] Re-enter the 3 GitHub PATs in the fresh vault; re-run /add-discord (same bot, token from the Discord dev portal)\n- [ ] Restore the follower-series ledger from the backup repo\n- [ ] Smoke tests per docs/INSTALL.md §7\n- [ ] Re-test anything in UPSTREAM-ISSUES.md marked "confirm on clean" against the new build\n' "$OLD" "$(cat current.json)")"
          mv current.json platform-baseline.json
          git config user.name "platform-watch"
          git config user.email "actions@users.noreply.github.com"
          git add platform-baseline.json
          git commit -m "platform-watch: record new upstream baseline"
          git push
